function carPhoto(c){return c.image||carPhotos[c.id-1]||carPhotos[0]}
let uploadedImage="";
let page='home',selected=1,query='',city='',maxPrice='',condition='',saved=new Set(),step=1,post={},photoAdded=false,category='الكل';
const fmt=n=>Number(n).toLocaleString('en-US');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg){let t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2800)}
function go(p){page=p;render();window.scrollTo(0,0)}function searchNow(){query=$('search').value.trim();category='الكل';go('results')}
function fav(id){saved.has(id)?saved.delete(id):saved.add(id);render();notify(saved.has(id)?'تمت الإضافة إلى المفضلة':'تمت الإزالة من المفضلة')}
function openAd(id){selected=id;go('detail')}
function card(c){return `<article class="listing" onclick="openAd(${c.id})"><img class="thumb" src="${carPhoto(c)}" alt="صورة السيارة"><div class="details"><h3>${esc(c.title)}</h3><div class="price">${fmt(c.price)} ريال</div><div class="sub">⌖ ${esc(c.city)} &nbsp; · &nbsp; ${fmt(c.mileage)} كم</div></div><button aria-label="مفضلة" class="heart ${saved.has(c.id)?'saved':''}" onclick="event.stopPropagation();fav(${c.id})">${saved.has(c.id)?'♥':'♡'}</button></article>`}
function header(t){return `<div class="heading"><h2>${t}</h2><button class="link" onclick="go('home')">الرئيسية ←</button></div>`}
function home(){return `<div class="content"><div class="heading"><h2>تصفح الأقسام</h2><span class="muted">اختر القسم المناسب</span></div><div class="cats">${[['🚘','سيارات'],['⌂','عقار'],['📱','أجهزة'],['▦','أخرى']].map(([e,n])=>`<button class="cat ${category===n?'active':''}" onclick="category='${n}';query='';go('results')"><b>${e}</b>${n}</button>`).join('')}</div><div class="heading"><h2>إعلانات مميزة</h2><button class="link" onclick="category='الكل';go('results')">عرض الكل ←</button></div>${cars.slice(0,3).map(card).join('')}<div class="footerhint">نموذج تجريبي لأغراض مشروع IT352</div></div>`}
function filtered(){return cars.filter(c=>(category==='الكل'||c.category===category)&&(!query||c.title.includes(query)||c.description.includes(query)||(/camry/i.test(query)&&c.title.includes('كامري')))&&(!city||c.city===city)&&(!maxPrice||c.price<=+maxPrice)&&(!condition||c.condition===condition))}
function results(){return `<div class="content">${header('نتائج البحث')}<div class="filterbox"><div class="grid2"><div class="field"><label>المدينة</label><select id="f-city" onchange="city=this.value;render()"><option value="">كل المدن</option>${['الرياض','جدة','الدمام'].map(x=>`<option ${city===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>الحد الأعلى للسعر</label><select id="f-price" onchange="maxPrice=this.value;render()"><option value="">أي سعر</option>${[45000,50000,60000].map(x=>`<option value="${x}" ${maxPrice==x?'selected':''}>${fmt(x)} ريال</option>`).join('')}</select></div></div><div class="field" style="margin:0"><label>الحالة</label><select onchange="condition=this.value;render()"><option value="">الكل</option><option ${condition==='مستعملة'?'selected':''}>مستعملة</option><option ${condition==='جديدة'?'selected':''}>جديدة</option></select></div><button class="link" style="margin-top:10px" onclick="city='';maxPrice='';condition='';query='';category='الكل';$('search').value='';render()">مسح الفلاتر</button></div><p class="resultcount">${filtered().length} نتائج متاحة</p>${filtered().length?filtered().map(card).join(''):'<div class="empty"><b>⌕</b>لا توجد إعلانات مطابقة. جرّب تغيير الفلاتر.</div>'}</div>`}
function detail(){let c=cars.find(x=>x.id===selected)||cars[0];return `<div class="content">${header('تفاصيل الإعلان')}<div class="photo"><img class="photoimg" src="${carPhoto(c)}" alt="صورة السيارة"><button class="photoheart heart ${saved.has(c.id)?'saved':''}" onclick="fav(${c.id})">${saved.has(c.id)?'♥':'♡'}</button><small>1 / 1</small></div><div class="detailcard"><h2 style="margin:0 0 9px;font-size:21px">${esc(c.title)}</h2><div class="price" style="font-size:26px">${fmt(c.price)} ريال</div><div class="sub">⌖ ${esc(c.city)}</div></div><div class="detailcard"><div class="heading" style="margin-top:0"><h2>معلومات السيارة</h2></div><div class="specs">${[['الحالة',c.condition],['سنة الموديل',c.year],['الممشى',fmt(c.mileage)+' كم']].map(([k,v])=>`<div class="spec"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div></div><div class="detailcard"><h3 style="margin:0 0 8px">وصف الإعلان</h3><p style="line-height:1.9;font-size:14px">${esc(c.description)}</p></div><div class="detailcard"><div class="seller"><div class="avatar">👤</div><div><strong>${esc(c.seller)}</strong><div class="verified">${c.verified?'✓ حساب موثق (بيانات تجريبية)':'حساب غير موثق'}</div></div></div><div class="actions"><button class="primary" onclick="notify('ميزة الاتصال محاكاة فقط — لا يتم الاتصال فعلياً')">☎ اتصال</button><button class="secondary" onclick="notify('تم فتح محادثة تجريبية — لا يتم إرسال رسائل')">✉ مراسلة</button><button class="secondary" onclick="fav(${c.id})">${saved.has(c.id)?'♥':'♡'}</button></div></div></div>`}
function posting(){let fields=`<div class="field"><label>القسم <span class="required">*</span></label><select id="p-category"><option value="">اختر القسم</option><option ${post.category==='سيارات'?'selected':''}>سيارات</option></select></div><div class="field"><label>عنوان الإعلان <span class="required">*</span></label><input id="p-title" value="${esc(post.title)}" placeholder="مثال: تويوتا كامري 2020"></div><div class="field"><label>وصف الإعلان <span class="required">*</span></label><textarea id="p-desc" placeholder="اذكر المواصفات وحالة السيارة">${esc(post.desc)}</textarea></div><div class="grid2"><div class="field"><label>السعر (ريال) <span class="required">*</span></label><input type="number" min="1" id="p-price" value="${esc(post.price)}" placeholder="55000"></div><div class="field"><label>سنة الموديل <span class="required">*</span></label><input type="number" min="1950" max="2027" id="p-year" value="${esc(post.year)}" placeholder="2020"></div><div class="field"><label>الممشى (كم) <span class="required">*</span></label><input type="number" min="0" id="p-mileage" value="${esc(post.mileage)}" placeholder="168000"></div><div class="field"><label>الحالة <span class="required">*</span></label><select id="p-condition"><option value="">اختر الحالة</option>${['جديدة','مستعملة'].map(x=>`<option ${post.condition===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>المدينة / الموقع <span class="required">*</span></label><select id="p-city"><option value="">اختر المدينة</option>${['الرياض','جدة','الدمام','مكة','المدينة'].map(x=>`<option ${post.city===x?'selected':''}>${x}</option>`).join('')}</select></div>`;return `<div class="content">${header('إضافة إعلان')}<div class="steps">${['المعلومات','الصور','المراجعة'].map((s,i)=>`<div class="step ${step===i+1?'active':''}"><b>${i+1}</b>${s}</div>`).join('')}</div>${step===1?`${fields}<button class="primary" onclick="nextInfo()">التالي: الصور ←</button>`:step===2?`<div class="field"><label>صور السيارة <span class="required">*</span></label><div class="upload" onclick="$('file').click()"><b>📷</b><strong>${photoAdded?'تم اختيار صورة':'اضغط لاختيار صورة'}</strong><div class="muted">ملف صورة واحد على الأقل مطلوب</div></div><input id="file" type="file" accept="image/*" style="display:none" onchange="choosePhoto(this)"></div><div class="actions"><button class="secondary" onclick="step=1;render()">رجوع</button><button class="primary" onclick="if(!photoAdded){notify('يرجى إضافة صورة واحدة على الأقل');return}step=3;render()">التالي: المراجعة</button></div>`:`<div class="notice">راجع البيانات قبل نشر الإعلان التجريبي.</div><div class="preview"><strong>${esc(post.title)}</strong><div class="price">${fmt(post.price)} ريال</div><div>القسم: ${esc(post.category)} · الموقع: ${esc(post.city)}</div><div>الموديل: ${esc(post.year)} · الممشى: ${fmt(post.mileage)} كم · الحالة: ${esc(post.condition)}</div><p>${esc(post.desc)}</p><div>📷 صورة مرفقة</div></div><div class="actions"><button class="secondary" onclick="step=1;render()">تعديل</button><button class="primary" onclick="publish()">نشر الإعلان التجريبي</button></div>`}<div class="footerhint">لا يتم إرسال البيانات إلى أي خادم أو نشر إعلان حقيقي.</div></div>`}
function choosePhoto(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{uploadedImage=r.result;photoAdded=true;render()};r.readAsDataURL(f)}
function nextInfo(){let ids=['category','title','desc','price','year','mileage','condition','city'];for(let id of ids)post[id]=($('p-'+id)?.value||'').trim();if(ids.some(x=>!post[x])){notify('يرجى تعبئة جميع الحقول المطلوبة');return}if(+post.price<=0||+post.mileage<0||+post.year<1950||+post.year>2027){notify('تحقق من السعر وسنة الموديل والممشى');return}step=2;render();window.scrollTo(0,0)}
function publish(){let c={id:Math.max(...cars.map(c=>c.id))+1,title:post.title,description:post.desc,price:+post.price,year:+post.year,mileage:+post.mileage,condition:post.condition,city:post.city,category:post.category,seller:'مستخدم تجريبي',verified:false,emoji:'🚘',image:uploadedImage};cars.unshift(c);selected=c.id;post={};photoAdded=false;uploadedImage="";step=1;go('detail');notify('تم إنشاء إعلان تجريبي بنجاح — لم يُنشر على حراج')}
function favorites(){let arr=cars.filter(c=>saved.has(c.id));return `<div class="content">${header('المفضلة')}${arr.length?arr.map(card).join(''):'<div class="empty"><b>♡</b>لم تحفظ أي إعلان بعد</div>'}</div>`}
const navIcons={"home": "<path d=\"M3 10 12 3l9 7v11h-6v-7H9v7H3z\"/>", "messages": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"m3 6 9 7 9-7\"/>", "post": "<path d=\"M12 5v14M5 12h14\"/>", "favorites": "<path d=\"M20.8 8.6c0 4.4-8.8 10-8.8 10s-8.8-5.6-8.8-10a4.8 4.8 0 0 1 8.8-2.7 4.8 4.8 0 0 1 8.8 2.7Z\"/>", "account": "<circle cx=\"12\" cy=\"7\" r=\"4\"/><path d=\"M4 21v-2a8 8 0 0 1 16 0v2z\"/>"};
function extraPage(){return `<div class="content">${header(page==='messages'?'الرسائل':'حسابي')}<div class="detailcard" style="text-align:center;padding:30px 12px">${page==='messages'?'لا توجد رسائل حالياً':'حساب مستخدم تجريبي'}<p class="muted">هذه الشاشة للعرض التجريبي فقط</p><button class="secondary" onclick="go('home')">العودة للرئيسية</button></div></div>`}
function render(){let sc=$('screen');sc.innerHTML=page==='home'?home():page==='results'?results():page==='detail'?detail():page==='post'?posting():page==='favorites'?favorites():extraPage();$('bottom').innerHTML=[['home','الرئيسية'],['messages','الرسائل'],['post','إضافة'],['favorites','المفضلة'],['account','حسابي']].map(([p,name])=>`<button class="nav ${p==='post'?'plus':''} ${page===p?'active':''}" onclick="go('${p}')" aria-label="${name}"><b><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${navIcons[p]}</svg></b>${name}</button>`).join('');$('searchbar').style.display=['home','results'].includes(page)?'flex':'none';if(['home','results'].includes(page))$('search').value=query}
render();
let test=null, tick=null;
const tasks=['Search for Toyota Camry (كامري).','Filter Camry results to Riyadh (الرياض), maximum SAR 60,000.','Open the 2020 Camry and identify its price, mileage, year and condition.','Save the 2020 Camry to favorites.','Create a sample car ad: تويوتا كامري 2020, description سيارة بحالة ممتازة, SAR 55000, year 2020, mileage 120000, used, Riyadh. Choose a sample car photo.'];
const questions=['The redesigned app is easy to use.','The homepage is clear and organized.','Search and filtering are easy to use.','Advertisement information is clear.','Creating an advertisement is easy.','Overall I am satisfied with the redesigned app.'];
function panel(){return $('testpanel')}
function intro(){panel().innerHTML='<h2>IT352 — Usability Testing</h2><p>Explore normally or start a guided test.</p><button onclick="setup()">Start usability testing</button>'}
function setup(){panel().innerHTML='<h2>Participant setup</h2><label>Participant ID <input id="pid" placeholder="P01"></label><label>Haraj experience <select id="experience"><option>Daily</option><option>Weekly</option><option>Monthly</option><option>Rarely</option><option>Never</option></select></label><button onclick="begin()">Begin test</button><button onclick="intro()">Cancel</button>'}
function begin(){let id=$("pid").value.trim();if(!/^P[0-9]+$/i.test(id)){alert('Enter an ID such as P01');return}test={id,experience:$("experience").value,i:0,rows:[],active:false,errors:0};saved.clear();cars.splice(0,cars.length,...cars.filter(c=>c.id<=4));query=city=maxPrice=condition='';category='الكل';post={};step=1;photoAdded=false;go('home');ready()}
function ready(){if(test.i===5){survey();return}panel().innerHTML=`<h2>Task ${test.i+1} of 5</h2><p>${tasks[test.i]}</p><button onclick="startTask()">Start task</button>`}
function startTask(){test.active=true;test.errors=0;test.start=performance.now();panel().innerHTML=`<h2>Task ${test.i+1} of 5</h2><p>${tasks[test.i]}</p><p class="timer" id="elapsed">0 s</p><button onclick="finish(false)">Cannot complete / skip</button><div id="answer"></div>`;tick=setInterval(()=>{let n=Math.floor((performance.now()-test.start)/1000);$('elapsed').textContent=n+' s';if(n>=(test.i===4?300:120))finish(false)},250);check()}
function finish(ok){if(!test?.active)return;clearInterval(tick);test.rows.push({task:test.i+1,seconds:((performance.now()-test.start)/1000).toFixed(1),errors:test.errors,result:ok?'Pass':'Fail'});test.active=false;test.i++;ready()}
function check(){if(!test?.active)return;let i=test.i;if(i===0&&page==='results'&&/كامري|camry/i.test(query)&&filtered().length)finish(true);else if(i===1&&page==='results'&&city==='الرياض'&&+maxPrice===60000&&filtered().some(c=>c.id===1))finish(true);else if(i===2&&page==='detail'&&selected===1&&!$('answer').innerHTML){$('answer').innerHTML='<p>Enter the details shown in the ad:</p><input id="ap" type="number" placeholder="Price"><input id="am" type="number" placeholder="Mileage"><input id="ay" type="number" placeholder="Year"><select id="ac"><option value="">Condition</option><option>Used</option><option>New</option></select><button onclick="verifyDetails()">Submit answers</button>'}else if(i===3&&saved.has(1))finish(true);else if(i===4&&cars.some(c=>c.id>4&&c.title.includes('كامري')&&c.price===55000&&c.year===2020&&c.mileage===120000&&c.city==='الرياض'&&c.condition==='مستعملة'))finish(true)}
function verifyDetails(){if(page==='detail'&&selected===1&&+$('ap').value===55000&&+$('am').value===168000&&+$('ay').value===2020&&$('ac').value==='Used')finish(true);else{test.errors++;alert('Please check the details again.')}}
function survey(){panel().innerHTML='<h2>Satisfaction survey</h2><p>1 = Strongly disagree; 5 = Strongly agree</p>'+questions.map((q,i)=>`<label>${q}<br><select id="rating${i}"><option value="">Select rating</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></label>`).join('')+'<button onclick="report()">Finish and view results</button>'}
function report(){let r=questions.map((q,i)=>$('rating'+i).value);if(r.some(x=>!x)){alert('Please answer all questions');return}test.ratings=r;panel().innerHTML='<h2>Testing results — '+esc(test.id)+'</h2><table><tr><th>Task</th><th>Seconds</th><th>Errors</th><th>Result</th></tr>'+test.rows.map(x=>`<tr><td>T${x.task}</td><td>${x.seconds}</td><td>${x.errors}</td><td>${x.result}</td></tr>`).join('')+'</table><p>Average satisfaction: '+(r.reduce((a,b)=>a+Number(b),0)/6).toFixed(2)+'/5</p><button onclick="exportCSV()">Export CSV results</button>'}
function exportCSV(){let rows=[['Participant','Experience','Task','Seconds','Detected errors','Result',...questions],...test.rows.map(x=>[test.id,test.experience,x.task,x.seconds,x.errors,x.result,...test.ratings])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='Haraj_Test_'+test.id+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const originalRender=render;render=function(){originalRender();check()};const originalNotify=notify;notify=function(msg){if(test?.active&&/يرجى|تحقق/.test(msg))test.errors++;originalNotify(msg)};
intro();
</script></body></html>
